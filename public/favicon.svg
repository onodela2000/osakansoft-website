<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="おさかなソフト">
  <!--
    ロゴのシンボル（一本線のおさかな＝O）のファビコン版。
    形はロゴと同一。尾びれのループも等倍のまま。
    16pxで線が飛ばないよう、線幅だけロゴの3.2%から4.3%（タイル比）に起こしてある。
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3648" />
      <stop offset="1" stop-color="#2C7F80" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112.64" fill="url(#tile)" />

  <g transform="translate(39.264 91.092) scale(0.785274)">
    <path
      d="M138 210
         C110 165, 74 170, 74 210
         C74 250, 110 255, 138 210
         C190 120, 280 88, 360 112
         C415 128, 453 165, 478 210
         C453 255, 415 292, 360 308
         C280 332, 190 300, 138 210"
      fill="none"
      stroke="#F8F5EC"
      stroke-width="26.32"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
