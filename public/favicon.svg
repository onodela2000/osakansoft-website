<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="おさかなソフト">
  <!--
    ロゴのシンボル（一本線のおさかな＝O）のファビコン版。
    ロゴそのままだと16pxで線が消えるため、2点だけ最適化してある。
      ・線幅をロゴの3.2%から6.1%（タイル比）に太らせた
      ・尾びれのループを接合点まわりに1.9倍。穴が潰れず「O」として読める
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3648" />
      <stop offset="1" stop-color="#2C7F80" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112.6" fill="url(#tile)" />

  <g transform="translate(91.71 116.44) scale(0.664598)">
    <path
      d="M138 210
         C84.8 124.5, 16.4 134, 16.4 210
         C16.4 286, 84.8 295.5, 138 210
         C190 120, 280 88, 360 112
         C415 128, 453 165, 478 210
         C453 255, 415 292, 360 308
         C280 332, 190 300, 138 210"
      fill="none"
      stroke="#F8F5EC"
      stroke-width="46.86"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
