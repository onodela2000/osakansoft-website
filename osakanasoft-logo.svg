      id="sea"
      gradientUnits="userSpaceOnUse"
      x1="67"
      y1="210"
      x2="1219.4"
      y2="210"
    >
      <stop offset="0" stop-color="#0C3A50" />
      <stop offset="0.52" stop-color="#26727A" />
      <stop offset="1" stop-color="#5E9EA2" />
    </linearGradient>
  </defs>

  <!--
    Tail loop = O / Odawara / Osakana
    Continuous path = idea, development, launch, and ongoing partnership
    Pointed head = forward progress
  -->
